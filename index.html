<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            text-align: center;
            font-family: 'Arial', sans-serif;
            color: white;
            overflow: hidden;
        }
        .container {
            padding: 20px;
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.3);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            position: relative;
        }
        h1 {
            font-size: 50px;
            margin: 0;
            animation: glow 2s infinite alternate;
        }
        p {
            font-size: 24px;
            margin-top: 10px;
        }
        @keyframes glow {
            0% { text-shadow: 0 0 10px white; }
            100% { text-shadow: 0 0 20px #ffcccb, 0 0 30px #ff66b2; }
        }

        /* 🎂 تحسين التورتة مع أنيميشن */
        .cake {
            position: relative;
            width: 250px;
            height: 180px;
            background: #ffcc80;
            border-radius: 15px;
            margin: 50px auto 0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            animation: bounce 2s infinite ease-in-out;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .layer {
            position: absolute;
            width: 100%;
            height: 50px;
            border-radius: 15px;
            bottom: 0;
        }
        .layer:nth-child(1) { background: #ff8a65; bottom: 0; }
        .layer:nth-child(2) { background: #e57373; bottom: 50px; }
        .layer:nth-child(3) { background: #ba68c8; bottom: 100px; }

        /* 🕯 شموع متحركة */
        .candles {
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
        }
        .candle {
            width: 15px;
            height: 50px;
            background: yellow;
            border-radius: 5px;
            position: relative;
            animation: shake 1.5s infinite alternate ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(3deg); }
        }
        .flame {
            position: absolute;
            width: 10px;
            height: 20px;
            background: orange;
            border-radius: 50%;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            animation: flicker 1s infinite alternate;
        }
        @keyframes flicker {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.7; transform: scale(1.2); }
        }

        /* 🎉 تأثير البالونات */
        .balloon {
            position: absolute;
            width: 50px;
            height: 70px;
            background: red;
            border-radius: 50%;
            top: 100vh;
            animation: float 5s linear infinite;
        }
        .balloon::before {
            content: '';
            position: absolute;
            width: 2px;
            height: 50px;
            background: white;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
        }
        @keyframes float {
            0% { transform: translateY(0); }
            100% { transform: translateY(-120vh); }
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>🎉 Happy Birthday! 🎉</h1>
        <p>I love you so much ❤</p>
        <div class="cake">
            <div class="layer"></div>
            <div class="layer"></div>
            <div class="layer"></div>
            <div class="candles">
                <div class="candle"><div class="flame"></div></div>
                <div class="candle"><div class="flame"></div></div>
                <div class="candle"><div class="flame"></div></div>
            </div>
        </div>
    </div>

    <script>
        // 🎈 إضافة بالونات متحركة
        function createBalloon() {
            let balloon = document.createElement("div");
            balloon.classList.add("balloon");
            document.body.appendChild(balloon);
            balloon.style.left = Math.random() * window.innerWidth + "px";
            balloon.style.background = `hsl(${Math.random() * 360}, 100%, 70%)`;
            balloon.style.animationDuration = (Math.random() * 3 + 2) + "s";
            setTimeout(() => { balloon.remove(); }, 5000);
        }
        setInterval(createBalloon, 500);
    </script>

</body>
</html>
